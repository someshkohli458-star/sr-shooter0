name: CYBERNEX Production Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; else echo 'No package.json found'; exit 0; fi
      - name: Build
        run: |
          if [ -f package.json ]; then npm run build; else echo 'No package.json found; build skipped.'; fi
